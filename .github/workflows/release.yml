name: Release L.A.M Agent Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

      - name: Build Application & Package Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:vite
          npx electron-builder --win nsis portable zip --x64

      - name: Compute Release Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt || true
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
